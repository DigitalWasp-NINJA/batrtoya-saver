<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#222"><title>バトロワ備忘録</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}body{font-family:sans-serif;background:#222 center/cover fixed;color:#222;min-height:100vh}
header{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:#000a;display:flex;align-items:center;padding:0 8px;gap:6px}
header .ttl{color:#fff;font-size:15px;font-weight:bold;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtn{background:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:15px;font-weight:bold;white-space:nowrap}
.ib{width:42px;height:42px;border:0;border-radius:50%;background:#fff;font-size:22px;padding:0}
#fpanel{position:fixed;top:52px;left:0;width:62%;max-height:70vh;overflow:auto;background:#fff;box-shadow:0 4px 12px #0008;z-index:30;display:none}
#fpanel div{padding:14px 12px;border-bottom:1px solid #ddd;font-size:16px}#fpanel div.cur{background:#e8eaed}
#fpanel div.act{color:#36c;font-weight:bold}#fpanel div.dng{color:#c33}
#main{padding:62px 4px 110px 8px;width:50%;position:relative;z-index:5}
body.wide #main{width:100%;padding-right:8px}
.page{display:none}.page.on{display:block}
.card{background:#fffffa;border-radius:8px;padding:10px;margin:8px 0}
.mc{background:#fff;position:relative;border-radius:10px;padding:10px;margin:10px 0;box-shadow:0 2px 5px #0006}
.mc h3{margin:0 0 6px;font-size:16px;word-break:break-all}.mc pre{white-space:pre-wrap;word-break:break-all;margin:0 0 8px;font-family:inherit;font-size:14px;line-height:1.5}
.mc small{color:#666}
.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.mh{cursor:pointer}.hint{color:#36c;font-size:12px;float:right}
.chip{display:inline-block;background:#e6f0ff;border:1px solid #9ab;border-radius:12px;padding:2px 8px;margin:2px 2px 4px 0;font-size:12px;color:#134}
.tgc .chip{font-size:14px;padding:6px 10px;margin:3px;cursor:pointer;background:#f3f3f3;border-color:#bbb;color:#333}
.tgc .chip.sel{background:#36c;color:#fff;border-color:#136}
.row{display:flex;gap:4px}.row select{font-size:13px;padding:6px;background:#fff}
.rel{margin-top:8px;border-top:1px solid #ccc;padding-top:6px}.rel b{font-size:13px;color:#036}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.rg div{background:#eef3ff;border:1px solid #9ab;border-radius:6px;padding:6px;font-size:13px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:#134}
input,textarea,select{width:100%;padding:9px;margin:3px 0;font-size:16px;border:1px solid #999;border-radius:5px}
textarea{min-height:200px}
button.b{padding:8px 10px;margin:2px;border:0;border-radius:6px;background:#36c;color:#fff;font-size:13px}
button.r{background:#c33}button.g{background:#888}button.y{background:#d90}
#fab{position:fixed;left:10px;bottom:14px;z-index:15;border:0;border-radius:30px;background:#c33;color:#fff;font-size:18px;font-weight:bold;padding:14px 20px;box-shadow:0 3px 8px #000a}
#nav{position:fixed;left:0;right:0;top:52px;bottom:0;z-index:1;pointer-events:none;overflow:hidden}
#nimg{position:absolute;right:-4%;top:0%;height:118%;width:auto;max-width:none}
.bub{position:fixed;right:4px;bottom:10px;width:54%;z-index:12;pointer-events:none;background:#fffffff2;border:4px solid #111;border-radius:20px;padding:16px;font-size:20px;line-height:1.55;min-height:170px;max-height:46vh;overflow:auto}
body.wide:not(.pv) #nimg{top:auto!important;bottom:-10%!important;height:80%!important}
body.wide:not(.pv) .bub{font-size:16px;min-height:0;max-height:24vh;width:50%}
body.pv #main,body.pv #fab,body.pv #fbtn,body.pv #hbtns{visibility:hidden}
#pvbar{position:fixed;top:60px;left:6px;width:48%;z-index:25;background:#fffffff0;border:2px solid #111;border-radius:10px;padding:8px;font-size:13px}
#pvbar label{display:block;margin:6px 0}#pvbar input[type=range]{padding:0;margin:2px 0}
.hide{display:none!important}
#modal{position:fixed;inset:0;background:#000b;z-index:40;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:60px 10px}
#modal .card{width:100%;max-width:520px;background:#fff}
.warn{background:#fdd;border:1px solid #c33;padding:6px;border-radius:6px;margin:4px 0;color:#900;font-size:13px}
.hv{border:1px solid #ccc;border-radius:8px;padding:8px;margin:6px 0;background:#fafafa}.hv pre{white-space:pre-wrap;word-break:break-all;margin:4px 0;font-family:inherit;font-size:13px;max-height:120px;overflow:auto}
.wheel{width:120px;height:120px;border-radius:50%;margin:14px auto;border:4px solid #111;position:relative;
background:conic-gradient(#e44 0 45deg,#fc3 0 90deg,#4b4 0 135deg,#39f 0 180deg,#e44 0 225deg,#fc3 0 270deg,#4b4 0 315deg,#39f 0 360deg)}
.wheel:after{content:"";position:absolute;top:-14px;left:calc(50% - 8px);border:8px solid transparent;border-top:16px solid #111}
.wheel.spin{animation:sp .5s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.big{font-size:16px;text-align:center;min-height:30px;font-weight:bold;background:#fff;border-radius:8px;padding:6px}
.memo{border-bottom:1px solid #ccc;padding:6px 0}small{color:#555}
</style></head><body>
<header><button class="fbtn" id="fbtn">📁 フォルダ ▾</button><div class="ttl" id="ttl"></div><span id="hbtns"></span></header>
<div id="fpanel"></div>
<div id="main">
 <div class="page on" id="memo"></div>
 <div class="page" id="roulette"></div>
 <div class="page" id="settings"></div>
</div>
<button id="fab">＋ 追加</button>
<div id="nav"><img id="nimg" class="hide"></div><div class="bub hide" id="nbub"></div>
<div id="pvbar" class="hide"></div>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s);
const SH="デフォルト(数秒後に自動で戻る)";
const EV={memo:{name:"メモ帳ページ",e:{def:SH,login:"ログイン",save:"メモ保存",copy:"メモコピペ",bookmark:"ブックマーク",del:"メモ削除",fAdd:"フォルダ作成",fDel:"フォルダ削除",warn:"注意(リンク被り/NGワード/1000文字超)",rollback:"履歴ロールバック",export:"Word・表で書き出し"}},
settings:{name:"オプション",e:{def:SH,login:"ログイン",change:"設定変更",reset:"設定初期化",navSet:"ナビゲーター設定"}},
roulette:{name:"ルーレット",e:{def:SH,login:"ログイン",folder:"フォルダ指定",start:"ルーレット開始",stop:"ルーレット停止",copy:"メモコピペ"}}};
const LIMIT=1000;
const SORTS={upd:"更新が新しい順",updo:"更新が古い順",new:"作成が新しい順",old:"作成が古い順",title:"タイトル順",len:"文字数が多い順",lens:"文字数が少ない順"};
const PRESET_TAGS=["善","中立","悪","美少女","戦闘能力持ち","非戦闘","頭脳派","異常者","悲しき過去","モンスター","ニンジャ","人外","カラテ型","特殊能力・ギミック・概念型","お変ク","無機物","未完成","シミュロワ"];
const DEF={memos:[],folders:["未分類"],ng:["殺害","殺す","信者","クソゲー","駄作"],wall:{color:"#222222",img:""},rem:[],lastFolder:"",pos:{},delay:5,sort:"upd",bmFirst:true,tagList:PRESET_TAGS.slice()};
let S=JSON.parse(localStorage.getItem("brm")||"null")||JSON.parse(JSON.stringify(DEF));
S.pos=S.pos||{};S.delay=S.delay||5;S.sort=S.sort||"upd";if(S.bmFirst===undefined)S.bmFirst=true;
if(!S.tagList)S.tagList=PRESET_TAGS.slice();
S.memos.forEach(m=>{m.tags=m.tags||[];m.hist=m.hist||[];m.rel=m.rel||[]});
S.nav=JSON.parse(localStorage.getItem("brm_nav")||"{}");
function save(){try{const{nav,...r}=S;localStorage.setItem("brm",JSON.stringify(r));localStorage.setItem("brm_nav",JSON.stringify(nav))}catch(e){alert("保存容量が不足しました。画像や履歴を減らしてください。")}}
let Q="",TG="",OPEN=new Set(),tab="memo",fl="all",rf="",rt=null,cur=null,NT=null,ED=null;
const len=s=>[...s].length;
const fmt=t=>new Date(t).toLocaleString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
// タグ候補 = 登録タグ(初期18種+追加分) + メモで使用中のタグ
const allTags=()=>[...new Set([...S.tagList,...S.memos.flatMap(m=>m.tags||[])])];
function addTagNames(str){const n=str.split(/[,、，]+/).map(x=>x.trim()).filter(Boolean);n.forEach(t=>{if(!S.tagList.includes(t))S.tagList.push(t)});save();return n}
const POSDEF={h:118,y:0,x:4};
const pos=(sec,ev)=>Object.assign({},POSDEF,S.pos[sec]||{},S.pos[sec+"."+ev]||{});
function applyPos(sec,ev){const p=pos(sec,ev),i=$("#nimg");i.style.height=p.h+"%";i.style.top=p.y+"%";i.style.right=(-p.x)+"%"}
const TC={};
function trim(src,cb){if(TC[src])return cb(TC[src]);const i=new Image();i.onload=()=>{
 try{const w=i.width,h=i.height,c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(i,0,0);
 const d=x.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
 for(let y=0;y<h;y++)for(let X=0;X<w;X++){if(d[(y*w+X)*4+3]>16){if(X<x0)x0=X;if(X>x1)x1=X;if(y<y0)y0=y;if(y>y1)y1=y}}
 if(x1<0||(x0===0&&y0===0&&x1===w-1&&y1===h-1)){TC[src]=src;return cb(src)}
 const c2=document.createElement("canvas");c2.width=x1-x0+1;c2.height=y1-y0+1;c2.getContext("2d").drawImage(c,x0,y0,c2.width,c2.height,0,0,c2.width,c2.height);
 TC[src]=c2.toDataURL("image/png");cb(TC[src])}catch(e){cb(src)}};i.src=src}
function say(sec,ev){clearTimeout(NT);
 const N=S.nav[sec]||{},d=N.def||{},hasDef=!!(d.img||d.line);
 let n=N[ev]||{},pe=ev;
 if(!n.img&&!n.line&&ev!=="def"&&hasDef){n=d;pe="def"}
 const im=$("#nimg"),b=$("#nbub");applyPos(sec,pe);
 if(n.img){trim(n.img,u=>{im.src=u;im.classList.remove("hide")})}else im.classList.add("hide");
 if(n.line){b.textContent=n.line;b.classList.remove("hide")}else b.classList.add("hide");
 if(pe!=="def"&&hasDef)NT=setTimeout(()=>{if(!document.body.classList.contains("pv"))say(sec,"def")},Math.max(1,S.delay)*1000)}
function openPV(sec,ev){const n=(S.nav[sec]||{})[ev]||{};clearTimeout(NT);
 if(!n.img)return alert("この場面には立ち絵画像が設定されていません。先に画像を設定してください。");
 document.body.classList.add("pv");applyPos(sec,ev);
 trim(n.img,u=>{$("#nimg").src=u;$("#nimg").classList.remove("hide")});
 $("#nbub").textContent=n.line||"セリフの表示位置(サンプル)";$("#nbub").classList.remove("hide");
 const p=pos(sec,ev),bar=$("#pvbar"),key=sec+"."+ev;
 const rows=[["h","大きさ",60,240],["y","上下(＋で下へ)",-60,80],["x","左右(＋で右へ)",-60,60]];
 bar.innerHTML=`<b>${EV[sec].name}／${EV[sec].e[ev]}</b>`+rows.map(([k,l,a,b])=>`<label>${l}: <span id="pv_${k}">${p[k]}</span>%<input type="range" data-k="${k}" min="${a}" max="${b}" value="${p[k]}"></label>`).join("")+
 `<button class="b g" id="pvr">初期値に戻す</button><button class="b y" id="pva">この画面の全場面に適用</button><button class="b" id="pvo">完了</button>`;
 bar.classList.remove("hide");
 bar.querySelectorAll("input[type=range]").forEach(r=>{r.oninput=()=>{S.pos[key]=Object.assign({},pos(sec,ev),{[r.dataset.k]:+r.value});$("#pv_"+r.dataset.k).textContent=r.value;applyPos(sec,ev)};r.onchange=save});
 $("#pvr").onclick=()=>{delete S.pos[key];save();openPV(sec,ev)};
 $("#pva").onclick=()=>{if(!confirm(`「${EV[sec].name}」のすべての場面を、この位置に揃えます。`))return;const v=pos(sec,ev);Object.keys(EV[sec].e).forEach(e=>S.pos[sec+"."+e]={...v});save();alert("適用しました")};
 $("#pvo").onclick=()=>{save();document.body.classList.remove("pv");bar.classList.add("hide");say("settings","navSet")}}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()})}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const urls=t=>(t.match(/https?:\/\/[^\s]+/g)||[]).map(u=>u.replace(/\/$/,""));
function check(m){const w=[],t=m.title+"\n"+m.body;
 const hit=S.ng.filter(n=>n&&t.includes(n));if(hit.length)w.push("NGワードの可能性: "+hit.join("、"));
 const my=urls(m.body),others=S.memos.filter(x=>x!==m).flatMap(x=>urls(x.body));
 const dup=my.filter((u,i)=>others.includes(u)||my.indexOf(u)!==i);if(dup.length)w.push("リンクが重複: "+[...new Set(dup)].join(" , "));
 const n=len(m.body);if(n>LIMIT)w.push(`キャラシートが${LIMIT}文字をオーバーしています(現在${n}文字)`);
 return w}
function go(t){tab=t;clearInterval(rt);rt=null;
 ["memo","roulette","settings"].forEach(x=>$("#"+x).classList.toggle("on",x===t));
 document.body.classList.toggle("wide",t==="settings");
 $("#fab").classList.toggle("hide",t!=="memo");$("#fbtn").classList.toggle("hide",t==="settings");$("#fpanel").style.display="none";
 const hb={memo:[["🎰","roulette"],["⚙️","settings"]],roulette:[["🏠","memo"],["⚙️","settings"]],settings:[["🏠","memo"],["🎰","roulette"]]}[t];
 $("#hbtns").innerHTML=hb.map(([i,p])=>`<button class="ib" data-go="${p}">${i}</button>`).join(" ");
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 if(t==="memo")renderMemo();if(t==="roulette")renderRoulette();if(t==="settings")renderSettings();
 say(t,"login")}
function renderFolderBtn(){const n=tab==="roulette"?(rf||"フォルダ指定"):(fl==="all"?"フォルダ":fl);$("#fbtn").textContent="📁 "+n+" ▾"}
$("#fbtn").onclick=()=>{const p=$("#fpanel");if(p.style.display==="block"){p.style.display="none";return}
 const sel=tab==="roulette"?rf:fl;
 let h=tab==="memo"?`<div data-f="all" class="${sel==="all"?"cur":""}">すべてのメモ</div>`:"";
 h+=S.folders.map(f=>`<div data-f="${esc(f)}" class="${f===sel?"cur":""}">📁 ${esc(f)}</div>`).join("");
 if(tab==="memo"){h+=`<div class="act" id="fadd">＋ フォルダ作成</div>`;if(fl!=="all"&&fl!=="未分類")h+=`<div class="dng" id="fdel">🗑 「${esc(fl)}」を削除</div>`}
 p.innerHTML=h;p.style.display="block";
 p.querySelectorAll("[data-f]").forEach(d=>d.onclick=()=>{const f=d.dataset.f;p.style.display="none";
  if(tab==="memo"){fl=f;renderMemo()}else{rf=f;S.lastFolder=f;save();renderRoulette();say("roulette","folder")}});
 if($("#fadd"))$("#fadd").onclick=()=>{const n=(prompt("フォルダ名")||"").trim();p.style.display="none";if(!n||S.folders.includes(n))return;S.folders.push(n);fl=n;save();renderMemo();say("memo","fAdd")};
 if($("#fdel"))$("#fdel").onclick=()=>{p.style.display="none";if(!confirm(`フォルダ「${fl}」を削除します。中のメモは「未分類」に移動します。`))return;
  S.memos.forEach(m=>{if(m.folder===fl)m.folder="未分類"});S.folders=S.folders.filter(f=>f!==fl);fl="all";save();renderMemo();say("memo","fDel")}};
function sorter(){const s=S.sort,f={upd:(a,b)=>b.ts-a.ts,updo:(a,b)=>a.ts-b.ts,new:(a,b)=>b.id-a.id,old:(a,b)=>a.id-b.id,
 title:(a,b)=>(a.title||"").localeCompare(b.title||"","ja"),len:(a,b)=>len(b.body)-len(a.body),lens:(a,b)=>len(a.body)-len(b.body)}[s]||((a,b)=>b.ts-a.ts);
 return S.bmFirst?(a,b)=>((+!!b.bm)-(+!!a.bm))||f(a,b):f}
function renderMemo(){renderFolderBtn();$("#ttl").textContent="";
 $("#memo").innerHTML=`<input id="qs" placeholder="🔍 検索(タイトル・本文・タグ)" style="background:#fff" value="${esc(Q)}">
 <div class="row"><select id="so">${Object.entries(SORTS).map(([k,v])=>`<option value="${k}" ${S.sort===k?"selected":""}>${v}</option>`).join("")}</select>
 <select id="tg"><option value="">🏷 すべてのタグ</option>${allTags().map(t=>`<option ${t===TG?"selected":""}>${esc(t)}</option>`).join("")}</select></div>
 <label style="color:#fff;font-size:13px"><input type="checkbox" id="bf" style="width:auto" ${S.bmFirst?"checked":""}> ★を先頭に</label><div id="ml"></div>`;
 const draw=()=>{const q=Q.toLowerCase();
  const list=S.memos.filter(m=>(fl==="all"||m.folder===fl)&&(!TG||m.tags.includes(TG))&&(!q||(m.title+m.body+m.tags.join(" ")).toLowerCase().includes(q))).sort(sorter());
  $("#ml").innerHTML=list.map(m=>{const o=OPEN.has(m.id),n=len(m.body);
   const rel=m.rel.map(id=>S.memos.find(x=>x.id===id)).filter(Boolean);
   return `<div class="mc" id="m${m.id}"><div class="mh" data-t="${m.id}"><span class="hint">${o?"▲":"▼"}</span><h3>${m.bm?"★ ":""}${esc(m.title||"(無題)")}</h3><pre class="${o?"":"clamp"}">${esc(m.body)}</pre></div>
   ${m.tags.map(t=>`<span class="chip" data-tag="${esc(t)}">#${esc(t)}</span>`).join("")}<br>
   <small>📁 ${esc(m.folder)}・${n}字${n>LIMIT?' <b style="color:#c33">⚠1000字超</b>':""}</small> <button class="b" data-a="cp" data-i="${m.id}">📋 コピー</button>
   ${o?`<button class="b y" data-a="bm" data-i="${m.id}">${m.bm?"★解除":"☆ ブックマーク"}</button><button class="b g" data-a="ed" data-i="${m.id}">編集</button><button class="b g" data-a="hs" data-i="${m.id}">🕘 履歴(${m.hist.length})</button><button class="b" data-a="wd" data-i="${m.id}">📄 Word</button><button class="b" data-a="xl" data-i="${m.id}">📊 表</button><button class="b r" data-a="dl" data-i="${m.id}">削除</button>
   ${rel.length?`<div class="rel"><b>関連メモ</b><div class="rg">${rel.map(r=>`<div data-j="${r.id}">${esc(r.title||"(無題)")}</div>`).join("")}</div></div>`:""}`:""}</div>`}).join("")||`<div class="card"><small>該当するメモがありません。左下の「＋追加」から作成できます。</small></div>`;
  document.querySelectorAll("#ml [data-t]").forEach(d=>d.onclick=()=>{const i=+d.dataset.t;OPEN.has(i)?OPEN.delete(i):OPEN.add(i);draw()});
  document.querySelectorAll("#ml [data-tag]").forEach(d=>d.onclick=()=>{TG=d.dataset.tag;renderMemo()});
  document.querySelectorAll("#ml [data-j]").forEach(d=>d.onclick=()=>{const i=+d.dataset.j;OPEN.add(i);fl="all";TG="";Q="";renderMemo();const el=$("#m"+i);if(el)el.scrollIntoView({block:"start"})});
  document.querySelectorAll("#ml [data-a]").forEach(bt=>bt.onclick=()=>{const m=S.memos.find(x=>x.id==bt.dataset.i),a=bt.dataset.a;
   if(a==="cp"){copy(m.body);say("memo","copy")}
   if(a==="bm"){m.bm=!m.bm;save();renderMemo();say("memo","bookmark")}
   if(a==="ed")openEditor(m.id);
   if(a==="hs")openHist(m.id);
   if(a==="wd")exportDocx([m],m.title||"メモ");
   if(a==="xl")exportXlsx([m],m.title||"メモ");
   if(a==="dl"&&confirm("削除しますか?(履歴も消えます)")){S.memos=S.memos.filter(x=>x!==m);S.memos.forEach(x=>{x.rel=x.rel.filter(r=>r!==m.id)});save();renderMemo();say("memo","del")}})};
 $("#qs").oninput=ev=>{Q=ev.target.value;draw()};
 $("#so").onchange=e=>{S.sort=e.target.value;save();renderMemo()};
 $("#tg").onchange=e=>{TG=e.target.value;renderMemo()};
 $("#bf").onchange=e=>{S.bmFirst=e.target.checked;save();renderMemo()};
 draw()}

  parts.push(new Uint8Array(h.buffer),nm,d);

  cd.push(new Uint8Array(g.buffer),nm);off+=30+nm.length+d.length}
 let cs=0;cd.forEach(x=>cs+=x.length);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,names.length,true);e.setUint16(10,names.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
